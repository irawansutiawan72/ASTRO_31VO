<svg xmlns="http://www.w3.org/2000/svg" width="420" height="70" viewBox="0 0 420 70">
  <!-- Number line -->
  <line x1="30" y1="38" x2="390" y2="38" stroke="white" stroke-width="2"/>
  <!-- Left arrow -->
  <polygon points="18,38 30,32 30,44" fill="white"/>
  <!-- Right arrow -->
  <polygon points="402,38 390,32 390,44" fill="white"/>

  <!-- Rectangle around negative region (between 2 and 3) -->
  <rect x="160" y="22" width="100" height="32" fill="none" stroke="white" stroke-width="1.5" rx="2"/>

  <!-- Open circle at x=2 (pos 160) -->
  <circle cx="160" cy="38" r="5" fill="#0f172a" stroke="white" stroke-width="2"/>
  <!-- Open circle at x=3 (pos 260) -->
  <circle cx="260" cy="38" r="5" fill="#0f172a" stroke="white" stroke-width="2"/>

  <!-- +++ left -->
  <text x="85" y="32" font-size="15" text-anchor="middle" fill="white" font-family="monospace">+ + +</text>
  <!-- - - - middle -->
  <text x="210" y="32" font-size="15" text-anchor="middle" fill="white" font-family="monospace">- - -</text>
  <!-- +++ right -->
  <text x="325" y="32" font-size="15" text-anchor="middle" fill="white" font-family="monospace">+ + +</text>

  <!-- Labels 2 and 3 -->
  <text x="160" y="62" font-size="14" text-anchor="middle" fill="white" font-family="Arial">2</text>
  <text x="260" y="62" font-size="14" text-anchor="middle" fill="white" font-family="Arial">3</text>
</svg>
